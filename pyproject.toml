[project]
name = "modeltree"
version = "0.1.0"
description = "The ancestry of every Hugging Face model, rebuilt nightly, with a most-descended base model leaderboard"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
